name: 🔄 Ongoing Anime 2-Hour Auto-Sync (Database Only)

on:
  schedule:
    # Run every 2 hours UTC (adjusted for continuous ongoing tracking)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: read

jobs:
  sync:
    name: Sync Ongoing Anime Releases to Turso Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Ongoing Dual-Engine Sync Pipeline (Direct to Turso Cloud)
        run: npm run cron:ongoing
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
