name: Top Up Coming Soon Release Gate

on:
  push:
    branches:
      - release/topup-coming-soon-20261015
  pull_request:
    branches: [main]
    paths:
      - 'src/app/topup/**'
      - 'src/components/layout/Navbar.tsx'
      - 'src/components/layout/BottomNav.tsx'
      - 'src/components/layout/Footer.tsx'
      - 'tests/verify-topup-coming-soon.ts'
      - '.github/workflows/topup-coming-soon-release.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Coming Soon only
        run: npx tsx tests/verify-topup-coming-soon.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
